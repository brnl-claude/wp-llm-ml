name: Release

# Two ways to publish a version (after `bin/version.sh set X.Y.Z` + commit):
#  1. GitHub → Releases → "Draft a new release" → new tag vX.Y.Z on the branch
#     → Publish. This workflow then tests, builds and attaches wp-llm-ml.zip
#     (and fills in the notes when the description was left empty).
#  2. git tag vX.Y.Z && git push origin vX.Y.Z — the release is created here.
# Sites with the plugin installed then see the update under Dashboard → Updates.
on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, intl
          coverage: none

      - name: Tag matches plugin version
        run: bin/version.sh check "${GITHUB_REF_NAME#v}"

      - name: Integration tests
        run: tests/run.sh "$RUNNER_TEMP/wpllmml"

      - name: Package test (builds dist/wp-llm-ml.zip)
        run: tests/package.sh "$RUNNER_TEMP/wpllmml-package"

      - name: Publish release with the plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          bin/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/wp-llm-ml.zip --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --title "LLM Multilingual $VERSION"
            fi
          else
            gh release create "$TAG" dist/wp-llm-ml.zip \
              --title "LLM Multilingual $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
