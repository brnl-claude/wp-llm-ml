name: Compatibility

# Every week, and on demand: all tests against the newest releases of WordPress, Elementor
# and Yoast SEO. The language switcher in the Elementor top bar uses Elementor's editor
# packages, which Elementor may change without notice; this run notices before the site
# updates. A failed run is e-mailed by GitHub. Without the top-bar switcher the
# "Translations" section in Elementor's Page Settings keeps working.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, intl
          coverage: none

      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Tests against the latest WordPress, Elementor and Yoast SEO
        env:
          WP_VERSION: latest
          ELEMENTOR_VERSION: latest
          YOAST_VERSION: latest
          WPLLMML_BROWSER: '1'
        run: tests/run.sh "$RUNNER_TEMP/wpllmml"
